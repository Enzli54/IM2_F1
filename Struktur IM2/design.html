<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Race Recap</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/design.css" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs"></script>

  <body>

    <!-- ── HEADER ──────────────────────────────────────────── -->
    <header class="app-header">
      <h1 class="app-title">F1 Race Recap</h1>
      <div class="app-header-car" aria-hidden="true">
        <dotlottie-player
          src="assets/lottie/f1-car.lottie"
          autoplay
          loop
          style="width:200px;height:68px;"
        ></dotlottie-player>
      </div>
      <div class="app-header-accent"></div>
    </header>

    <!-- ── FILTER ROW ───────────────────────────────────────── -->
    <div class="filter-row">
      <div class="filter-cell">
        <label class="filter-label" for="year-select">Year</label>
        <div class="select-wrap">
          <select class="filter-select" id="year-select">
            <option value="">Jahr wählen</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
          </select>
          <span class="select-chevron">&#8964;</span>
        </div>
      </div>

      <div class="filter-cell">
        <label class="filter-label" for="race-select">Race</label>
        <div class="select-wrap">
          <select class="filter-select" id="race-select" disabled>
            <option value="">Rennen wählen</option>
          </select>
          <span class="select-chevron">&#8964;</span>
        </div>
      </div>

      <div class="filter-cell">
        <label class="filter-label" for="session-select">Session</label>
        <div class="select-wrap">
          <select class="filter-select" id="session-select">
            <option value="Race">Race</option>
            <option value="Qualifying">Qualifying</option>
            <option value="Sprint">Sprint</option>
          </select>
          <span class="select-chevron">&#8964;</span>
        </div>
      </div>
    </div>

    <!-- ── RACE NAME CARD ───────────────────────────────────── -->
    <div class="race-name-card">
      <h2 class="race-name" id="race-name">Wähle eine Saison und ein Rennen</h2>
    </div>

    <!-- ── MAIN CONTENT ─────────────────────────────────────── -->
    <main class="main-content">

      <!-- Loading state -->
      <div class="main-loading hidden" id="main-loading">
        <div class="spinner"></div>
        <span>Daten werden geladen…</span>
      </div>

      <!-- Empty state -->
      <div class="empty-hint" id="empty-hint">
        <p>Wähle oben eine Saison und ein Rennen, um die Daten zu laden.</p>
      </div>

      <!-- Podium + Side Panel -->
      <div class="content-row hidden" id="content-row">

        <!-- Podium ─────────────────────── -->
        <section class="podium-section">
          <div class="podium-stage" id="podium-stage">
            <!-- rendered by JS -->
          </div>
        </section>

        <!-- Weather + Circuit ────────── -->
        <aside class="side-panel">
          <div class="weather-card">
            <p class="weather-card-title">Weather condition:</p>
            <div class="wrow">
              <span class="wkey">air temperature:</span>
              <span class="wval" id="w-air">–</span>
            </div>
            <div class="wrow">
              <span class="wkey">track temperature:</span>
              <span class="wval" id="w-track">–</span>
            </div>
            <div class="wrow">
              <span class="wkey">humidity:</span>
              <span class="wval" id="w-humid">–</span>
            </div>
            <div class="wrow">
              <span class="wkey">rain:</span>
              <span class="wval" id="w-rain">–</span>
            </div>
            <div class="weather-sun" aria-hidden="true">☀</div>
          </div>

          <div class="circuit-card">
            <button class="circuit-expand" id="circuit-expand" title="Strecke vergrössern">&#10132;</button>
            <!-- Simplified F1 circuit SVG (generic layout) -->
            <svg class="circuit-mini-svg" viewBox="0 0 280 200" xmlns="http://www.w3.org/2000/svg" aria-label="Streckenkarte">
              <path class="cmini-path" d="
                M 140 12
                C 168 12 194 18 212 34
                C 228 48 236 68 238 90
                C 240 112 234 130 220 142
                C 206 154 188 156 174 148
                C 160 140 154 126 148 112
                C 142 98 140 84 134 76
                C 128 68 118 66 110 72
                C 100 79 95 92 90 106
                C 85 120 84 136 76 146
                C 67 157 54 162 42 158
                C 29 154 20 142 16 128
                C 12 114 14 98 20 84
                C 26 70 34 58 36 46
                C 38 34 32 22 24 18
                C 14 14 4 18 4 28
                L 4 188 L 276 188 L 276 90

              "/>
              <line class="cmini-sf" x1="138" y1="6" x2="142" y2="18"/>
              <circle class="cmini-dot" cx="236" cy="88" r="4"/>

    </main>

    <!-- ─────────────────────────────────────────────────────── -->
    <!-- DRIVER DETAIL POPUP                                     -->
    <!-- ─────────────────────────────────────────────────────── -->
    <div class="overlay hidden" id="driver-popup" role="dialog" aria-modal="true" aria-label="Fahrerdetails">
      <div class="overlay-backdrop" onclick="closeDriverPopup()"></div>
      <div class="popup-win">

        <div class="popup-titlebar">
          <span class="popup-titlebar-text">F1 Race Recap</span>
          <div class="popup-titlebar-dots" id="popup-dots"></div>
          <button class="popup-close" onclick="closeDriverPopup()" aria-label="Schliessen">&#x2715;</button>
        </div>

        <div class="popup-body" id="driver-popup-body">
          <div class="popup-loading">
            <div class="spinner dark"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- ─────────────────────────────────────────────────────── -->
    <!-- TRACK MAP POPUP                                         -->
    <!-- ─────────────────────────────────────────────────────── -->
    <div class="overlay hidden" id="track-popup" role="dialog" aria-modal="true" aria-label="Streckenansicht">
      <div class="overlay-backdrop" onclick="closeTrackPopup()"></div>
      <div class="popup-win popup-win-track">

        <div class="popup-titlebar">
          <span class="popup-titlebar-text">F1 Race Recap</span>
          <div></div>
          <button class="popup-close" onclick="closeTrackPopup()" aria-label="Schliessen">&#x2715;</button>
        </div>

        <div class="track-body">
          <div class="track-map-area">
            <!-- Start blocks (Figma style) -->
            <div class="track-sf-blocks">
              <div class="track-sf-b"></div>
              <div class="track-sf-b"></div>
            </div>
            <svg class="track-full-svg" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" id="track-svg">
              <path class="track-path-full" d="
                M 200 20
                C 240 20 278 28 305 50
                C 330 70 344 98 346 128

                C 298 210 274 212 255 202
                C 236 192 224 174 216 156
                C 208 138 205 120 196 110
                C 187 100 174 98 164 106
                C 152 115 146 130 140 146
                C 134 162 132 180 122 192
                C 111 205 94 212 78 206
                C 61 200 48 186 40 170
                C 32 154 30 136 35 120
                C 40 104 50 90 52 76
                C 54 62 46 48 36 40
                C 24 32 10 34 8 46
                C 5 59 14 74 20 88
                C 26 102 30 116 26 130
                C 22 144 12 154 8 168
                L 8 280 L 392 280 L 392 128
                C 392 60 350 20 280 16
                C 255 14 225 18 200 20 Z
              "/>
              <line class="track-sf-line" x1="198" y1="12" x2="202" y2="24"/>
              <circle class="track-driver-dot" cx="342" cy="125" r="7" id="track-dot"/>
            </svg>
          </div>

          <div class="track-controls">
            <button class="tc-btn" onclick="trackCtrl('start')" title="Anfang">&#9646;&#9664;</button>
            <button class="tc-btn" onclick="trackCtrl('back')" title="Zurück">&#9664;</button>
            <button class="tc-btn tc-play" id="tc-play" onclick="trackCtrl('play')" title="Play">&#9654;</button>
            <button class="tc-btn" onclick="trackCtrl('fwd')" title="Vor">&#9654;&#9654;</button>
            <div class="tc-scrubber" id="tc-scrubber" onclick="scrubberClick(event)">
              <div class="tc-track">
                <div class="tc-fill" id="tc-fill" style="width:0%"></div>
                <div class="tc-thumb" id="tc-thumb" style="left:0%"></div>
              </div>

      </div>
    </div>

    <!-- ─────────────────────────────────────────────────────── -->
    <!-- JAVASCRIPT                                              -->
    <!-- ─────────────────────────────────────────────────────── -->
    <script>
      'use strict';

      // ── API ──────────────────────────────────────────────────
      const API_BASE = 'https://api.openf1.org/v1';
      const apiCache = new Map();

      async function apiFetch(endpoint, params = {}) {
        const cacheKey = endpoint + JSON.stringify(params);
        if (apiCache.has(cacheKey)) return apiCache.get(cacheKey);

        const url = new URL(API_BASE + endpoint);
        Object.entries(params).forEach(([k, v]) => {
          if (v == null) return;
          if (Array.isArray(v)) v.forEach(i => url.searchParams.append(k, i));
          else url.searchParams.append(k, v);
        });

        const res = await fetch(url);
        if (res.status === 429) {
          await new Promise(r => setTimeout(r, 600));
          return apiFetch(endpoint, params);
        }
        if (!res.ok) throw new Error(`API ${res.status}: ${endpoint}`);
        const data = await res.json();
        apiCache.set(cacheKey, data);
        return data;
      }

      // ── State ────────────────────────────────────────────────
      let state = {
        year: null,
        meetings: [],
        sessions: [],
        currentSession: null,
        currentMeeting: null,
      };

      // ── Helpers ──────────────────────────────────────────────
      function formatLapTime(s) {
        if (!s || s <= 0) return '–';
        const m   = Math.floor(s / 60);
        const sec = (s % 60).toFixed(3);
        return `${m}:${sec.padStart(6, '0')}`;
      }

      function silhouetteSVG(cls = '') {
        return `<svg viewBox="0 0 40 44" class="${cls}" fill="currentColor" aria-hidden="true">
          <circle cx="20" cy="11" r="9"/>
          <path d="M3 42C3 29 10 22 20 22C30 22 37 29 37 42Z"/>
        </svg>`;
      }

      function tireColor(compound) {
        const c = (compound || '').toUpperCase();
        if (c === 'SOFT')         return '#E8002D';
        if (c === 'MEDIUM')       return '#FFC906';
        if (c === 'HARD')         return '#AAAAAA';
        if (c === 'INTERMEDIATE') return '#43B02A';
        if (c === 'WET')          return '#0067FF';
        return '#888';
      }

      function tireClass(compound) {
        const c = (compound || '').toLowerCase();
        return `tire-${c}`;
      }

      // ── Year / Race / Session selects ────────────────────────
      document.getElementById('year-select').addEventListener('change', async function () {
        const year = this.value;
        if (!year) return;
        state.year = year;

        const raceSelect = document.getElementById('race-select');
        raceSelect.disabled = true;
        raceSelect.innerHTML = '<option value="">Wird geladen…</option>';

        setMainLoading(true);
        hideAll();

        try {
          [state.meetings, state.sessions] = await Promise.all([
            apiFetch('/meetings', { year }),
            apiFetch('/sessions', { year })
          ]);
          populateRaceSelect();
          raceSelect.disabled = false;
        } catch (e) {
          showEmptyHint('Fehler beim Laden: ' + e.message);
        } finally {
          setMainLoading(false);
        }
      });

      document.getElementById('session-select').addEventListener('change', () => {
        if (state.sessions.length) populateRaceSelect();
      });

      document.getElementById('race-select').addEventListener('change', async function () {
        const opt = this.selectedOptions[0];
        if (!opt?.value) return;
        state.currentSession  = opt.value;
        state.currentMeeting  = opt.dataset.meetingKey;
        await loadRaceData();
      });

      function populateRaceSelect() {
        const sel         = document.getElementById('race-select');
        const sessionType = document.getElementById('session-select').value;
        sel.innerHTML     = '<option value="">Rennen wählen</option>';

        state.sessions
          .filter(s => s.session_type?.toLowerCase() === sessionType.toLowerCase())
          .sort((a, b) => new Date(a.date_start) - new Date(b.date_start))
          .forEach(s => {
            const m = state.meetings.find(m => m.meeting_key === s.meeting_key);
            if (!m) return;
            const opt            = document.createElement('option');
            opt.value            = s.session_key;
            opt.dataset.meetingKey = m.meeting_key;
            opt.textContent      = m.meeting_official_name;
            sel.appendChild(opt);
          });
      }

      // ── Load Race Overview ───────────────────────────────────
      async function loadRaceData() {
        setMainLoading(true);
        hideAll();

        try {
          const meeting = state.meetings.find(m => m.meeting_key == state.currentMeeting);
          document.getElementById('race-name').textContent =
            (meeting?.meeting_official_name || '').toUpperCase();

          await Promise.all([
            loadPodium(state.currentSession),
            loadWeather(state.currentSession),
            loadDriverGrid(state.currentSession),
          ]);

          document.getElementById('content-row').classList.remove('hidden');
          document.getElementById('driver-grid-section').classList.remove('hidden');
        } catch (e) {
          showEmptyHint('Fehler: ' + e.message);
          console.error(e);
        } finally {
          setMainLoading(false);
        }
      }

      // ── Podium ───────────────────────────────────────────────
      async function loadPodium(sessionKey) {
        const [results, drivers] = await Promise.all([
          apiFetch('/session_result', { session_key: sessionKey }),
          apiFetch('/drivers',        { session_key: sessionKey }),
        ]);

        const dmap = Object.fromEntries(drivers.map(d => [d.driver_number, d]));
        const top3 = results
          .filter(r => r.position >= 1 && r.position <= 3)
          .sort((a, b) => a.position - b.position);

        // Podium display order: P3 | P1 | P2
        const order = [
          top3.find(r => r.position === 3),
          top3.find(r => r.position === 1),
          top3.find(r => r.position === 2),
        ].filter(Boolean);

        const stage = document.getElementById('podium-stage');
        stage.innerHTML = '';

        order.forEach(result => {
          const d = dmap[result.driver_number];
          if (!d) return;

          const el       = document.createElement('div');
          el.className   = `podium-driver podium-p${result.position}`;
          el.title       = `${d.full_name} — Position ${result.position}`;
          el.innerHTML   = `
            <div class="podium-info">
              ${d.headshot_url
                ? `<img class="podium-headshot" src="${d.headshot_url}" alt="${d.full_name}" loading="lazy"/>`
                : `<div class="podium-silhouette">${silhouetteSVG()}</div>`
              }
              <span class="podium-code">${d.name_acronym}</span>
            </div>
            <div class="podium-block">
              <span class="podium-pos">${result.position}.</span>
            </div>
          `;
          el.addEventListener('click', () => openDriverPopup(result.driver_number, d));
          stage.appendChild(el);
        });
      }

      // ── Weather ──────────────────────────────────────────────
      async function loadWeather(sessionKey) {
        const data = await apiFetch('/weather', { session_key: sessionKey });
        if (!data.length) return;
        const w = data[data.length - 1];
        document.getElementById('w-air').textContent   = w.air_temperature   + '°C';
        document.getElementById('w-track').textContent = w.track_temperature + '°C';
        document.getElementById('w-humid').textContent = w.humidity          + ' %';
        document.getElementById('w-rain').textContent  = w.rainfall ? 'Ja' : 'Nein';
      }

      // ── Driver Grid ──────────────────────────────────────────
      async function loadDriverGrid(sessionKey) {
        const [results, drivers] = await Promise.all([
          apiFetch('/session_result', { session_key: sessionKey }),
          apiFetch('/drivers',        { session_key: sessionKey }),
        ]);

        const dmap   = Object.fromEntries(drivers.map(d => [d.driver_number, d]));
        const rest   = results
          .filter(r => r.position > 3)
          .sort((a, b) => a.position - b.position);

        const grid   = document.getElementById('driver-grid');
        grid.innerHTML = '';

        rest.forEach(result => {
          const d = dmap[result.driver_number];
          if (!d) return;

          const card      = document.createElement('div');
          card.className  = 'driver-card';
          card.title      = d.full_name;
          card.innerHTML  = `
            <span class="dc-pos">${result.position}.</span>
            <div class="dc-avatar">
              ${d.headshot_url
                ? `<img src="${d.headshot_url}" alt="${d.full_name}" loading="lazy"/>`
                : silhouetteSVG('dc-silhouette')}
            </div>
            <span class="dc-name">${d.name_acronym}</span>
          `;
          card.addEventListener('click', () => openDriverPopup(result.driver_number, d));
          grid.appendChild(card);
        });
      }

      // ── Driver Popup ─────────────────────────────────────────
      async function openDriverPopup(driverNumber, driverHint) {
        const popup = document.getElementById('driver-popup');
        const body  = document.getElementById('driver-popup-body');
        popup.classList.remove('hidden');
        body.innerHTML = '<div class="popup-loading"><div class="spinner dark"></div></div>';

        try {
          const [drivers, laps, stints, radios, allResults] = await Promise.all([
            apiFetch('/drivers',        { session_key: state.currentSession, driver_number: driverNumber }),
            apiFetch('/laps',           { session_key: state.currentSession, driver_number: driverNumber }),
            apiFetch('/stints',         { session_key: state.currentSession, driver_number: driverNumber }),
            apiFetch('/team_radio',     { session_key: state.currentSession, driver_number: driverNumber }),
            apiFetch('/session_result', { session_key: state.currentSession }),
          ]);

          const driver = drivers[0] || driverHint || {};
          const result = allResults.find(r => String(r.driver_number) === String(driverNumber));

          // Fastest valid lap
          const validLaps = laps.filter(l => l.lap_duration > 0);
          const fastest   = validLaps.length
            ? validLaps.reduce((b, l) => l.lap_duration < b.lap_duration ? l : b)
            : null;

          // Team accent color
          const accent = driver.team_colour ? '#' + driver.team_colour : '#E10600';
          document.getElementById('popup-dots').innerHTML = `
            <span class="ptdot" style="background:${accent}"></span>
            <span class="ptdot" style="background:${accent};opacity:.5"></span>
            <span class="ptdot" style="background:${accent};opacity:.2"></span>
          `;

          // Number formatting (e.g. 01, 44)
          const numStr = String(driver.driver_number || driverNumber).padStart(2, '0');

          // Tire stints HTML
          const stintHTML = stints.length
            ? stints.map((s, i) => `
                <div class="dpu-tire-item">
                  <div class="dpu-tire-circle" style="border-color:${tireColor(s.compound)};color:${tireColor(s.compound)}">
                    <span class="dpu-tire-inner"></span>
                  </div>
                  <div class="dpu-tire-meta">
                    <span class="dpu-tire-range">${s.lap_start}–${s.lap_end}</span>
                    <span class="dpu-tire-laps">${(s.lap_end - s.lap_start)} Runden</span>
                  </div>
                </div>
                ${i < stints.length - 1 ? '<div class="dpu-tire-connector"></div>' : ''}
              `).join('')
            : '<span class="dpu-empty">–</span>';

          // Radios HTML (max 4)
          const radioHTML = radios.slice(0, 4).map((r, i) => {
            const t = new Date(r.date).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            return `
              <div class="dpu-radio-item">
                <button class="dpu-radio-btn" data-url="${r.recording_url}" data-idx="${i}" onclick="playRadio(this)">&#9654;</button>
                <div class="dpu-radio-track"><div class="dpu-radio-fill" id="rfill-${i}"></div></div>
                <span class="dpu-radio-time">${t}</span>
              </div>
            `;
          }).join('') || '<span class="dpu-empty">Keine Team Radios verfügbar</span>';

          body.innerHTML = `
            <!-- Driver Row -->
            <div class="dpu-driver">
              <span class="dpu-num">${numStr}</span>
              <span class="dpu-name">${driver.full_name || '–'}</span>
              <div class="dpu-avatar">
                ${driver.headshot_url
                  ? `<img src="${driver.headshot_url}" alt="${driver.full_name}" loading="lazy"/>`
                  : silhouetteSVG()}
              </div>
            </div>

            <div class="dpu-divider"></div>

            <!-- Fastest Lap -->
            <div class="dpu-lap-row">
              <div class="dpu-lap-left">
                <p class="dpu-lap-sub">Schnellste Runde${fastest ? ': Lap ' + fastest.lap_number : ''}</p>
                <p class="dpu-lap-time">${fastest ? formatLapTime(fastest.lap_duration) : '–'}</p>
              </div>
              <div class="dpu-sectors">
                <div class="dpu-sec">
                  <span class="dpu-sec-lbl">S1</span>
                  <span class="dpu-sec-val">${fastest?.duration_sector_1?.toFixed(3) || '–'}</span>
                </div>
                <div class="dpu-sec dpu-sec-personal">
                  <span class="dpu-sec-lbl">S2</span>
                  <span class="dpu-sec-val">${fastest?.duration_sector_2?.toFixed(3) || '–'}</span>
                </div>
                <div class="dpu-sec dpu-sec-best">
                  <span class="dpu-sec-lbl">S3</span>
                  <span class="dpu-sec-val">${fastest?.duration_sector_3?.toFixed(3) || '–'}</span>
                </div>
              </div>
            </div>

            <div class="dpu-divider"></div>

            <!-- Two-column: Tires + Radios -->
            <div class="dpu-two-col">
              <div class="dpu-col">
                <p class="dpu-col-heading">Reifenstrategie</p>
                <div class="dpu-tire-items">${stintHTML}</div>
              </div>
              <div class="dpu-col">
                <p class="dpu-col-heading">Team Radios</p>
                <div class="dpu-radio-list">${radioHTML}</div>
              </div>
            </div>

            <div class="dpu-divider"></div>

            <!-- Result -->
            <div class="dpu-result">
              <p class="dpu-col-heading">Position in der World Championship</p>
              <div class="dpu-result-rows">
                <div class="dpu-result-row">
                  <span>Finish-Position:</span>
                  <span class="dpu-result-val">Platz ${result?.position || '–'}</span>
                </div>
                <div class="dpu-result-row">
                  <span>Team:</span>
                  <span class="dpu-result-val">${driver.team_name || '–'}</span>
                </div>
              </div>
            </div>
          `;

        } catch (e) {
          body.innerHTML = `<p class="dpu-error">Fehler: ${e.message}</p>`;
          console.error(e);
        }
      }

      function closeDriverPopup() {
        document.getElementById('driver-popup').classList.add('hidden');
        stopAllAudio();
      }

      // ── Audio ────────────────────────────────────────────────
      let currentAudio = null;
      let currentAudioBtn = null;
      let audioSimInterval = null;

      function playRadio(btn) {
        const url  = btn.dataset.url;
        const idx  = btn.dataset.idx;
        const fill = document.getElementById('rfill-' + idx);
        const isActive = btn.classList.contains('dpu-radio-playing');

        stopAllAudio();
        if (isActive) return;

        btn.classList.add('dpu-radio-playing');
        btn.innerHTML = '&#9646;&#9646;';
        currentAudioBtn = btn;

        currentAudio = new Audio(url);
        currentAudio.crossOrigin = 'anonymous';

        currentAudio.addEventListener('timeupdate', () => {
          const pct = (currentAudio.currentTime / (currentAudio.duration || 1)) * 100;
          if (fill) fill.style.width = pct + '%';
        });
        currentAudio.addEventListener('ended', () => {
          if (fill) fill.style.width = '0%';
          btn.innerHTML = '&#9654;';
          btn.classList.remove('dpu-radio-playing');
          currentAudio = null;
          currentAudioBtn = null;
        });

        currentAudio.play().catch(() => {
          // Fallback simulation if CORS blocks playback
          let pct = 0;
          audioSimInterval = setInterval(() => {
            pct = Math.min(100, pct + 0.6);
            if (fill) fill.style.width = pct + '%';
            if (pct >= 100) {
              clearInterval(audioSimInterval);
              if (fill) fill.style.width = '0%';
              btn.innerHTML = '&#9654;';
              btn.classList.remove('dpu-radio-playing');
              currentAudioBtn = null;
            }
          }, 80);
        });
      }

      function stopAllAudio() {
        if (currentAudio) { try { currentAudio.pause(); } catch(_){} currentAudio = null; }
        clearInterval(audioSimInterval);
        document.querySelectorAll('.dpu-radio-btn').forEach(b => {
          b.innerHTML = '&#9654;';
          b.classList.remove('dpu-radio-playing');
        });
        document.querySelectorAll('.dpu-radio-fill').forEach(f => f.style.width = '0%');
        currentAudioBtn = null;
      }

      // ── Track Popup ──────────────────────────────────────────
      document.getElementById('circuit-expand').addEventListener('click', () => {
        document.getElementById('track-popup').classList.remove('hidden');
      });

      function closeTrackPopup() {
        document.getElementById('track-popup').classList.add('hidden');
        stopTrack();
      }

      let trackPct = 0, trackPlaying = false, trackAnimId = null;

      function trackCtrl(action) {
        const fill  = document.getElementById('tc-fill');
        const thumb = document.getElementById('tc-thumb');
        const btn   = document.getElementById('tc-play');

        if (action === 'play') {
          trackPlaying = !trackPlaying;
          btn.innerHTML = trackPlaying ? '&#9646;&#9646;' : '&#9654;';
          if (trackPlaying) {
            trackAnimId = setInterval(() => {
              trackPct = trackPct >= 100 ? 0 : trackPct + 0.18;
              setTrackProgress(trackPct);
            }, 60);
          } else {
            stopTrack(false);
          }
        } else if (action === 'start') { trackPct = 0; setTrackProgress(0); }
        else if (action === 'back')    { trackPct = Math.max(0,   trackPct - 5); setTrackProgress(trackPct); }
        else if (action === 'fwd')     { trackPct = Math.min(100, trackPct + 5); setTrackProgress(trackPct); }
      }

      function setTrackProgress(pct) {
        document.getElementById('tc-fill').style.width  = pct + '%';
        document.getElementById('tc-thumb').style.left  = pct + '%';
        // Animate dot along a simplified ellipse path
        const t  = (pct / 100) * Math.PI * 2;
        const cx = 200 + 148 * Math.cos(t - Math.PI / 2);
        const cy = 150 + 118 * Math.sin(t - Math.PI / 2);
        const dot = document.getElementById('track-dot');
        if (dot) { dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); }
      }

      function stopTrack(resetBtn = true) {
        clearInterval(trackAnimId);
        trackPlaying = false;
        if (resetBtn) {
          const btn = document.getElementById('tc-play');
          if (btn) btn.innerHTML = '&#9654;';
        }
      }

      function scrubberClick(e) {
        const rect = document.getElementById('tc-scrubber').querySelector('.tc-track').getBoundingClientRect();
        trackPct   = ((e.clientX - rect.left) / rect.width) * 100;
        setTrackProgress(trackPct);
      }

      // ── UI Helpers ───────────────────────────────────────────
      function setMainLoading(on) {
        document.getElementById('main-loading').classList.toggle('hidden', !on);
        if (on) document.getElementById('empty-hint').classList.add('hidden');
      }

      function hideAll() {
        document.getElementById('content-row').classList.add('hidden');
        document.getElementById('driver-grid-section').classList.add('hidden');
        document.getElementById('empty-hint').classList.add('hidden');
      }

      function showEmptyHint(msg) {
        const el = document.getElementById('empty-hint');
        el.querySelector('p').textContent = msg;
        el.classList.remove('hidden');
      }

      // Keyboard escape
      document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        closeDriverPopup();
        closeTrackPopup();
      });
    </script>

  </body>
</html>
